name: Smoke CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start Ollama stub server
        run: |
          mkdir -p .github/ci
          cat <<'PY' > .github/ci/ollama_stub.py
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          import threading

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/api/tags"):
                      payload = {"models": [{"name": "llama3.1:latest"}]}
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps(payload).encode("utf-8"))
                  else:
                      self.send_error(404)

              def do_POST(self):
                  if self.path.startswith("/api/generate"):
                      length = int(self.headers.get("Content-Length", 0))
                      self.rfile.read(length)
                      payload = {"text": "stub response"}
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps(payload).encode("utf-8"))
                  else:
                      self.send_error(404)

              def log_message(self, format, *args):
                  return

          server = HTTPServer(("127.0.0.1", 11434), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          print("Ollama stub running on port 11434")
          input()
          server.shutdown()
          PY
          python .github/ci/ollama_stub.py &
          echo $! > .github/ci/ollama_pid

      - name: Install project
        run: pip install -e .

      - name: Show help
        run: sutra help

      - name: Create demo project
        run: sutra create demo "test"

      - name: Run demo pipeline
        run: sutra run projects/demo/pipeline.py --text "hello"

      - name: Shutdown stub
        if: always()
        run: kill $(cat .github/ci/ollama_pid)
