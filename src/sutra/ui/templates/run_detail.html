<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run {{ run_id }}</title>
  <style>
    body { font-family: "Inter", system-ui, sans-serif; margin: 0; padding: 2rem; background: #05060a; color: #f4f6ff; }
    a { color: #7cc4ff; }
    .file-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .file-card summary { padding: 0.9rem 1.1rem; cursor: pointer; font-weight: 600; }
    pre { margin: 0; padding: 1rem; background: #0b0d17; border-radius: 0 0 16px 16px; overflow-x: auto; }
  </style>
</head>
<body>
  <p><a href="/">← Back to dashboard</a></p>
  <h1>Trace: {{ run_id }}</h1>
  {% if files %}
    {% for file in files %}
    <details class="file-card" open>
      <summary>{{ file.name }}</summary>
      <pre>{{ file.raw }}</pre>
    </details>
    {% endfor %}
  {% else %}
  <p>No trace files for this run.</p>
  {% endif %}
</body>
</html>
